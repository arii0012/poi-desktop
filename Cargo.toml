[package]
name = "poi-desktop"
version = "1.1.2"
edition = "2021"
description = "PoiPaper Desktop"
license = "MIT"

[dependencies]
eframe = { version = "=0.27.2", default-features = true, features = ["default_fonts"] }
egui = "=0.27.2"
image = { version = "0.24.9", default-features = false, features = ["png"] }
dirs = "5.0.1"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
strip = true
