[package]
name = "poi-desktop"
version = "1.1.0"
edition = "2021"
description = "PoiPaper Desktop — красивые 3D-подобные фигуры и живые обои для Windows"
authors = ["PoiPaper"]
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rand = "0.8"
chrono = "0.4"

# Windows wallpaper API
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
